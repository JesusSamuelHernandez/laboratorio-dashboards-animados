<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portada 01 · Anillos concéntricos</title>
  <style>
    :root {
      --bg: #fffaf4; --ink: #1f2937; --muted: #6b7280;
      --aqua: #12c7c7; --aqua-d: #0b8f98; --orange: #ff7a1a; --orange-d: #d85a00;
      --ring: 31, 41, 55;           /* rgb de los anillos neutros */
      --veil: 255, 250, 244;        /* rgb del velo que protege el texto */
      --line: #f1e4d6;
    }
    [data-theme="dark"] {
      --bg: #07111f; --ink: #e8f1fb; --muted: #8fa3bd;
      --aqua: #3be0e0; --aqua-d: #3be0e0; --orange: #ff9a45; --orange-d: #ff9a45;
      --ring: 200, 220, 240; --veil: 7, 17, 31; --line: #1d2a44;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1000px 600px at 85% -10%, color-mix(in srgb, var(--aqua) 14%, transparent), transparent 60%),
                  radial-gradient(900px 600px at 0% 0%, color-mix(in srgb, var(--orange) 14%, transparent), transparent 55%),
                  var(--bg);
      color: var(--ink); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden;
      transition: background-color .5s, color .5s;
    }
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* velo suave detrás del texto para mantener legibilidad sobre los anillos */
    .veil { position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(closest-side at 50% 48%, rgba(var(--veil), .92), rgba(var(--veil), .55) 55%, transparent 100%);
      width: min(920px, 96vw); height: min(560px, 70vh); margin: auto; }

    main { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; pointer-events: none; }
    main > div { max-width: 860px; }
    a, button { pointer-events: auto; }

    .eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--aqua-d); text-transform: uppercase; }
    h1 { margin: 14px 0 0; font-size: clamp(44px, 8.6vw, 104px); line-height: .98; letter-spacing: -0.035em; font-weight: 700; }
    h1 .line { display: block; overflow: hidden; padding-bottom: .08em; }
    h1 .line > span { display: inline-block; }
    h1 em { font-style: normal; background: linear-gradient(90deg, var(--orange), var(--aqua)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { margin: 22px auto 0; max-width: 560px; color: var(--muted); font-size: clamp(16px, 2vw, 19px); line-height: 1.5; }
    .cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 32px; }

    .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font: inherit; font-weight: 600;
      padding: 12px 24px; border-radius: 12px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
    .btn span { position: relative; z-index: 1; transition: color .25s; }
    .btn.primary { background: var(--orange); color: #fff; border: 0; box-shadow: 0 10px 24px color-mix(in srgb, var(--orange) 35%, transparent); }
    .btn.primary::before { content: ''; position: absolute; inset: 0; background: var(--aqua); transform: translateY(101%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
    .btn.primary:hover::before, .btn.primary:focus-visible::before { transform: translateY(0); }
    .btn.primary:hover span, .btn.primary:focus-visible span { color: #04312f; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid rgba(var(--ring), .25); }
    .btn.ghost:hover, .btn.ghost:focus-visible { border-color: var(--aqua); color: var(--aqua-d); }
    .btn:active { transform: scale(.97); }
    .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s; position: relative; z-index: 1; }
    .btn:hover svg { transform: translateX(4px); }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--aqua) 60%, transparent); outline-offset: 3px; }

    .hud { position: fixed; z-index: 3; left: 24px; bottom: 22px; display: flex; gap: 18px; font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
    .hud b { color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 6px; }
    .ctrl { position: fixed; z-index: 3; right: 20px; bottom: 16px; display: flex; gap: 8px; }
    .ctrl button, .ctrl a { text-decoration: none; }
    .ctrl button, .ctrl a { background: rgba(var(--veil), .7); color: var(--muted); border: 1px solid rgba(var(--ring), .18); border-radius: 99px; padding: 7px 14px; font: 600 12px inherit; font-family: inherit; cursor: pointer; backdrop-filter: blur(6px); transition: border-color .2s, color .2s; }
    .ctrl a:hover, .ctrl button:hover { border-color: var(--aqua); color: var(--aqua-d); }
    @media (max-width: 640px) { .hud { gap: 10px; font-size: 10px; left: 14px; bottom: 56px; } .ctrl { right: 14px; bottom: 12px; } }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <main>
    <div>
      <span class="eyebrow">Laboratorio de visualización · 2026</span>
      <h1>
        <span class="line"><span>Datos en</span></span>
        <span class="line"><span><em>movimiento</em></span></span>
      </h1>
      <p class="lead">Tableros, mapas e indicadores que respiran con la información: cada anillo, un sistema; cada cruce, una relación.</p>
      <div class="cta">
        <a class="btn primary" href="../index.html"><span>Explorar prototipos</span><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></a>
        <a class="btn ghost" href="../p03-gsap-catalog/index.html"><span>Ver muestrario</span></a>
      </div>
    </div>
  </main>

  <div class="hud" aria-live="off">
    <span>Nodos<b id="h-n">0</b></span><span>Enlaces<b id="h-l">0</b></span><span>Cruces<b id="h-c">0</b></span>
  </div>
  <div class="ctrl">
    <a href="index.html">☰ Portadas</a>
    <button id="b-pause" type="button">❚❚ Pausar</button>
    <button id="b-theme" type="button">◐ Tema</button>
  </div>

  <!-- GSAP solo para la entrada del texto; si no carga, todo se ve igual (sin animar). -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
  (() => {
    'use strict'
    const $ = (s) => document.querySelector(s)
    const cvs = $('#bg'), ctx = cvs.getContext('2d')
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
    const TAU = Math.PI * 2
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
    const lerp = (a, b, k) => a + (b - a) * k
    const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3)

    let W = 0, H = 0, DPR = 1, sys = [], ripples = [], pal = {}
    let paused = reduce, tv = reduce ? 5 : 0, last = 0, raf = 0
    const mouse = { x: -9999, y: -9999, sx: -9999, sy: -9999, on: false }
    const hud = { n: 0, l: 0, c: 0 }

    /* ───── paleta (lee las variables CSS, así respeta el tema) ───── */
    const hex = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})` }
    const neutral = (a) => `rgba(${pal.ring},${a})`
    function readPal() {
      const cs = getComputedStyle(document.documentElement)
      pal = { aqua: cs.getPropertyValue('--aqua').trim(), orange: cs.getPropertyValue('--orange').trim(), ring: cs.getPropertyValue('--ring').trim() }
    }

    /* ───── construcción de los sistemas de anillos ───── */
    function build() {
      const base = Math.min(W, H)
      const n = W < 700 ? 3 : W < 1100 ? 4 : 5
      const anchors = [[.24, .32], [.76, .3], [.5, .72], [.13, .74], [.87, .74]]
      const scale = [1, .85, 1.1, .8, .95]
      sys = anchors.slice(0, n).map((a, i) => {
        const R = base * 0.34 * scale[i]
        const rings = Array.from({ length: 6 }, (_, k) => ({
          r: R * (0.2 + 0.8 * (k / 5)),
          ph: i * 1.3 + k * 0.9,
          spin: (k % 2 ? 1 : -1) * (0.08 + 0.05 * k) * (i % 2 ? 1 : -1),
          arcs: Array.from({ length: 1 + ((i + k) % 3) }, (_, m) => ({ a0: (m / 3) * TAU + k, len: 0.5 + ((k + m) % 3) * 0.45 })),
          lw: k === 5 ? 1.2 : 1,
        }))
        return {
          i, R, rings, ax: a[0], ay: a[1], col: i % 2 ? 'orange' : 'aqua',
          dx: W * 0.07, dy: H * 0.08, fx: 0.11 + 0.025 * i, fy: 0.09 + 0.02 * i, ph: i * 1.7,
          cx: a[0] * W, cy: a[1] * H, e: 0,
        }
      })
    }

    /* ───── geometría ───── */
    function circleX(x0, y0, r0, x1, y1, r1) {
      const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy)
      if (d > r0 + r1 || d < Math.abs(r0 - r1) || d === 0) return null
      const a = (r0 * r0 - r1 * r1 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r0 * r0 - a * a))
      const mx = x0 + (a * dx) / d, my = y0 + (a * dy) / d
      return [[mx + (h * dy) / d, my - (h * dx) / d], [mx - (h * dy) / d, my + (h * dx) / d]]
    }

    /* ───── un fotograma ───── */
    function frame(t) {
      ctx.clearRect(0, 0, W, H)
      const intro = easeOut(t / 2.2)
      ctx.globalAlpha = intro
      // cursor suavizado
      if (mouse.on) { mouse.sx = lerp(mouse.sx, mouse.x, 0.12); mouse.sy = lerp(mouse.sy, mouse.y, 0.12) }

      // 1) posiciones + radios vivos
      for (const s of sys) {
        let cx = s.ax * W + s.dx * Math.sin(t * s.fx + s.ph), cy = s.ay * H + s.dy * Math.cos(t * s.fy + s.ph * 1.3)
        // el cursor atrae y “excita” el sistema cercano
        const reach = s.R * 1.7, dm = mouse.on ? Math.hypot(mouse.sx - cx, mouse.sy - cy) : 1e9
        const near = clamp(1 - dm / reach)
        cx += (mouse.sx - cx) * near * 0.16; cy += (mouse.sy - cy) * near * 0.16
        s.e = lerp(s.e, near, 0.06); s.cx = cx; s.cy = cy; s.near = near; s.dm = dm
        s.live = s.rings.map((r, k) => {
          const grow = easeOut((t - 0.15 * k - s.i * 0.18) / 1.6)
          return r.r * grow * (1 + 0.045 * Math.sin(t * 0.8 + r.ph) + 0.1 * s.e * Math.sin(t * 3 - k))
        })
      }

      // 2) anillos
      for (const s of sys) {
        const acc = pal[s.col]
        s.rings.forEach((r, k) => {
          const rad = s.live[k]
          if (rad < 0.5) return
          ctx.lineWidth = r.lw
          ctx.strokeStyle = neutral(0.13 + 0.03 * k + 0.1 * s.e)
          ctx.beginPath(); ctx.arc(s.cx, s.cy, rad, 0, TAU); ctx.stroke()
          // arcos de acento que giran
          ctx.strokeStyle = hex(acc, 0.55 + 0.35 * s.e); ctx.lineWidth = r.lw + 1.2; ctx.lineCap = 'round'
          for (const a of r.arcs) {
            const a0 = a.a0 + t * r.spin
            ctx.beginPath(); ctx.arc(s.cx, s.cy, rad, a0, a0 + a.len); ctx.stroke()
          }
          // marcas tipo medidor en el anillo exterior
          if (k === 5) {
            ctx.strokeStyle = neutral(0.22); ctx.lineWidth = 1; ctx.beginPath()
            const off = t * 0.03
            for (let m = 0; m < 72; m++) {
              const a = off + (m / 72) * TAU, len = m % 6 === 0 ? 8 : 4
              ctx.moveTo(s.cx + Math.cos(a) * (rad + 3), s.cy + Math.sin(a) * (rad + 3))
              ctx.lineTo(s.cx + Math.cos(a) * (rad + 3 + len), s.cy + Math.sin(a) * (rad + 3 + len))
            }
            ctx.stroke()
          }
        })
        // núcleo
        ctx.fillStyle = hex(acc, 0.9); ctx.beginPath(); ctx.arc(s.cx, s.cy, 3 + 2 * s.e, 0, TAU); ctx.fill()
      }

      // 3) relaciones: enlaces, paquetes y cruces entre anillos del mismo nivel
      let links = 0, cross = 0
      for (let a = 0; a < sys.length; a++) for (let b = a + 1; b < sys.length; b++) {
        const A = sys[a], B = sys[b], d = Math.hypot(B.cx - A.cx, B.cy - A.cy), reach = (A.R + B.R) * 1.15
        const s = clamp(1 - d / reach), ss = s * s * (3 - 2 * s)
        if (ss > 0.01) {
          links++
          const g = ctx.createLinearGradient(A.cx, A.cy, B.cx, B.cy)
          g.addColorStop(0, hex(pal[A.col], 0.2 + 0.6 * ss)); g.addColorStop(1, hex(pal[B.col], 0.2 + 0.6 * ss))
          ctx.strokeStyle = g; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(A.cx, A.cy); ctx.lineTo(B.cx, B.cy); ctx.stroke()
          for (let m = 0; m < 3; m++) {
            const u = (t * 0.16 + (a * 7 + b * 3) * 0.13 + m / 3) % 1, uu = (a + b) % 2 ? u : 1 - u
            ctx.fillStyle = hex(pal[uu > 0.5 ? B.col : A.col], 0.35 + 0.6 * ss)
            ctx.beginPath(); ctx.arc(lerp(A.cx, B.cx, uu), lerp(A.cy, B.cy, uu), 2.4, 0, TAU); ctx.fill()
          }
        }
        // cruces: donde el anillo k de un sistema toca al anillo k del otro
        for (let k = 0; k < 6; k++) {
          const pts = circleX(A.cx, A.cy, A.live[k], B.cx, B.cy, B.live[k]); if (!pts) continue
          for (const [px, py] of pts) {
            cross++
            ctx.strokeStyle = neutral(0.6); ctx.lineWidth = 1
            ctx.beginPath(); ctx.arc(px, py, 5, 0, TAU); ctx.stroke()
            ctx.fillStyle = hex(pal.orange, 0.95); ctx.beginPath(); ctx.arc(px, py, 2.2, 0, TAU); ctx.fill()
          }
        }
      }

      // 4) etiquetas de datos que “leen” un anillo
      ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, monospace'; ctx.textBaseline = 'middle'
      sys.slice(0, 3).forEach((s) => {
        const k = 3, rad = s.live[k]; if (rad < 4) return
        const ang = t * 0.22 * (s.i % 2 ? -1 : 1) + s.i * 2.1, v = 55 + 40 * Math.sin(t * 0.3 + s.i * 2)
        const txt = s.i % 3 === 0 ? `${v.toFixed(0)}%` : s.i % 3 === 1 ? `${(v * 12.4).toFixed(0)}k` : `${(v / 10).toFixed(1)}M`
        const px = s.cx + Math.cos(ang) * rad, py = s.cy + Math.sin(ang) * rad
        const ox = px + Math.cos(ang) * 22, oy = py + Math.sin(ang) * 22
        ctx.strokeStyle = neutral(0.35); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ox, oy); ctx.stroke()
        ctx.fillStyle = pal[s.col]; ctx.beginPath(); ctx.arc(px, py, 3, 0, TAU); ctx.fill()
        ctx.fillStyle = neutral(0.8); ctx.textAlign = Math.cos(ang) >= 0 ? 'left' : 'right'
        ctx.fillText(txt, ox + (Math.cos(ang) >= 0 ? 4 : -4), oy)
      })

      // 5) cursor y ondas de clic
      if (mouse.on) {
        for (const s of sys) if (s.near > 0.02) {
          ctx.strokeStyle = hex(pal[s.col], 0.35 * s.near); ctx.lineWidth = 1
          ctx.beginPath(); ctx.moveTo(mouse.sx, mouse.sy); ctx.lineTo(s.cx, s.cy); ctx.stroke()
        }
        ctx.strokeStyle = neutral(0.4); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(mouse.sx, mouse.sy, 12 + 2 * Math.sin(t * 4), 0, TAU); ctx.stroke()
      }
      ripples = ripples.filter((r) => t - r.t0 < 2.4)
      for (const r of ripples) {
        const age = t - r.t0
        for (let m = 0; m < 3; m++) {
          const rad = (age - m * 0.16) * 260; if (rad <= 0) continue
          ctx.strokeStyle = hex(pal[r.col], clamp(1 - age / 2.4) * 0.6 * (1 - m * 0.3)); ctx.lineWidth = 1.5
          ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke()
        }
      }
      ctx.globalAlpha = 1

      if (links !== hud.l || cross !== hud.c || sys.length !== hud.n) {
        hud.l = links; hud.c = cross; hud.n = sys.length
        $('#h-n').textContent = hud.n; $('#h-l').textContent = hud.l; $('#h-c').textContent = hud.c
      }
    }

    /* ───── bucle ───── */
    function loop(now) {
      raf = requestAnimationFrame(loop)
      const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now
      tv += dt; frame(tv)
    }
    function play() { if (raf) return; last = performance.now(); raf = requestAnimationFrame(loop) }
    function stop() { cancelAnimationFrame(raf); raf = 0 }
    function setPaused(p) {
      paused = p; p ? stop() : play()
      $('#b-pause').textContent = p ? '▶ Reanudar' : '❚❚ Pausar'
      if (p) frame(tv)
    }

    /* ───── tamaño ───── */
    function resize() {
      DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight
      cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR)
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
      build(); if (paused) frame(tv)
    }
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120) })

    /* ───── interacción ───── */
    addEventListener('pointermove', (e) => { if (!mouse.on) { mouse.sx = e.clientX; mouse.sy = e.clientY } mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true })
    document.addEventListener('pointerleave', () => { mouse.on = false })
    addEventListener('pointerdown', (e) => {
      if (e.target.closest('a,button')) return
      ripples.push({ x: e.clientX, y: e.clientY, t0: tv, col: Math.random() < 0.5 ? 'aqua' : 'orange' })
      if (paused) frame(tv)
    })
    $('#b-pause').addEventListener('click', () => setPaused(!paused))
    $('#b-theme').addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark'
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      try { localStorage.setItem('p05-theme', dark ? 'dark' : 'light') } catch (e) { /* sin storage */ }
      setTimeout(() => { readPal(); if (paused) frame(tv) }, 30)
    })
    try { const t = localStorage.getItem('p05-theme'); if (t) document.documentElement.dataset.theme = t } catch (e) { /* sin storage */ }

    /* ───── arranque ───── */
    readPal(); resize()
    if (reduce) { setPaused(true) } else { play() }

    // entrada del texto (solo si GSAP cargó)
    if (window.gsap && !reduce) {
      const g = gsap
      g.timeline({ defaults: { ease: 'power4.out' } })
        .from('.eyebrow', { autoAlpha: 0, letterSpacing: '0.5em', duration: 1.2 })
        .from('h1 .line > span', { yPercent: 115, duration: 1.1, stagger: 0.14 }, 0.15)
        .from('.lead', { y: 18, autoAlpha: 0, duration: 0.8 }, 0.7)
        .from('.cta .btn', { y: 16, autoAlpha: 0, duration: 0.7, stagger: 0.1 }, 0.85)
        .from('.hud span, .ctrl button, .ctrl a', { autoAlpha: 0, y: 8, duration: 0.6, stagger: 0.06 }, 1.1)
    }
  })()
  </script>
</body>
</html>
